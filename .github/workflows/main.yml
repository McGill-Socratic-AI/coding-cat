name: Test, build & deploy the Coding Cat app
on:
  push:
    branches: [main, dev]

  pull_request:
    branches: [main, staging, dev]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test
  build:
    name: Build problem list and static files
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule sync
      # Two submodules are private and this repository is a public fork, so the
      # job's GITHUB_TOKEN cannot read either of them. Skipping them keeps the
      # build honest about what it covers: it compiles the app against the
      # public problem set only.
      #
      # The COMP204 set therefore is NOT built here. It holds the instructor's
      # reference solutions, and giving this workflow a credential that could
      # read them would put the answer key one leaked log away from a public
      # repository. That build belongs in the COMP204 deployment pipeline, which
      # runs under its own identity. See docs/comp204-deployment.md.
      - run: |
          git -c submodule.src/private-problems.update=none \
              -c submodule.src/comp204-problems.update=none \
              submodule update --init --recursive
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
  deploy:
    name: Deploy to GitHub Pages
    # Only deploy when something is pushed (or merged) into main.
    # Skips PRs and pushes to dev / staging — they should run test + build only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the artifacts
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
